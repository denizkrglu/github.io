    <script>
        // Mobil menü
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        function menuAyarla(acik) {
            menu.classList.toggle('hidden', !acik);
            btn.setAttribute('aria-expanded', acik ? 'true' : 'false');
            btn.setAttribute('aria-label', acik ? 'Menüyü kapat' : 'Menüyü aç');
        }

        btn.addEventListener('click', () => menuAyarla(menu.classList.contains('hidden')));
        mobileLinks.forEach(link => link.addEventListener('click', () => menuAyarla(false)));

        // Esc tuşu açık menüyü kapatır
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
                menuAyarla(false);
                btn.focus();
            }
        });

        // ---------- Yazılar için ortak yardımcılar (bu bölümü değiştirmeniz gerekmez) ----------
        const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
        const ONIZLEME = new URLSearchParams(location.search).has('onizleme');

        function kacis(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function tarihYaz(t) {
            const p = String(t || '').split('-').map(Number);
            if (!p[0]) return '';
            return (p[2] ? p[2] + ' ' : '') + AYLAR[(p[1] || 1) - 1] + ' ' + p[0];
        }
        function satirIci(s) {   // *italik*, **kalın**, [bağlantı](https://...)
            return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }
        function metniCevir(metin) {   // her satır bir paragraf; ## ara başlık; > alıntı; > — kaynak; * * * ayraç
            const satirlar = String(metin || '').replace(/\r/g, '').split('\n').map(x => x.trim()).filter(Boolean);
            const cikti = [];
            for (const satir of satirlar) {
                if (/^\*(\s*\*){2}$/.test(satir)) { cikti.push('<hr>'); continue; }
                if (satir.startsWith('## ')) { cikti.push('<h2>' + satirIci(kacis(satir.slice(3))) + '</h2>'); continue; }
                if (satir.startsWith('>')) {
                    const ic = satir.replace(/^>\s?/, '');
                    const son = cikti[cikti.length - 1] || '';
                    if (/^(—|--)/.test(ic) && son.startsWith('<blockquote>')) {
                        cikti[cikti.length - 1] = son.replace('</blockquote>', '<cite>' + satirIci(kacis(ic.replace(/^(—|--)\s*/, ''))) + '</cite></blockquote>');
                    } else {
                        cikti.push('<blockquote><p>' + satirIci(kacis(ic)) + '</p></blockquote>');
                    }
                    continue;
                }
                cikti.push('<p>' + satirIci(kacis(satir)) + '</p>');
            }
            return cikti.join('\n');
        }
        function yazilariGetir() {
            if (!Array.isArray(window.YAZILAR)) return null;
            return window.YAZILAR
                .filter(y => y && y.adres && y.baslik && (ONIZLEME || !y.taslak))
                .sort((a, b) => String(b.tarih || '').localeCompare(String(a.tarih || '')));
        }
        function yaziAdresi(y) { return 'yazi.html?y=' + encodeURIComponent(y.adres) + (ONIZLEME ? '&onizleme' : ''); }
        function taslakIsareti(y) { return y.taslak ? ' <span class="ml-2 px-1.5 py-0.5 bg-bordo text-cream">Taslak</span>' : ''; }

        // Liste kartı (görsel isteğe bağlı)
        function kart(y, boyut) {
            const gorsel = y.gorsel ? '<div class="kart-gorsel aspect-[4/3] mb-5"><img src="' + kacis(y.gorsel) + '" alt="" loading="lazy" decoding="async"></div>' : '';
            const ozet = y.ozet || y.altBaslik;
            return '<article class="kart relative ' + (y.gorsel ? '' : 'border-t border-line pt-6') + '">' + gorsel +
                '<p class="rubrik">' + kacis(y.tur || 'Yazı') + taslakIsareti(y) + '</p>' +
                '<h3 class="kart-baslik mt-3 ' + (boyut || 'text-[1.75rem]') + '"><a href="' + yaziAdresi(y) + '">' + kacis(y.baslik) + '</a></h3>' +
                (ozet ? '<p class="mt-3 italic text-[1rem] leading-[1.65] text-muted">' + kacis(ozet) + '</p>' : '') +
                '<p class="mt-4 font-label text-[0.68rem] uppercase tracking-[0.16em] text-muted">' + tarihYaz(y.tarih) + '</p>' +
                '</article>';
        }

        // ---------- Tek yazı sayfası ----------
        (function () {
            const alan = document.getElementById('yazi');
            const yazilar = yazilariGetir() || [];
            const adres = new URLSearchParams(location.search).get('y');
            const y = yazilar.find(x => x.adres === adres);
            if (!y) {
                alan.innerHTML = '<div class="py-24 text-center"><p class="italic text-[1.125rem] text-muted">Bu yazı bulunamadı.</p>' +
                    '<a href="yazilarim.html" class="rubrik mt-6 inline-block border-b border-bordo/30 pb-1 hover:border-bordo transition-colors">Tüm yazılar</a></div>';
                return;
            }
            document.title = y.baslik + ' — Deniz Köroğlu';
            const aciklama = document.querySelector('meta[name="description"]');
            if (aciklama && (y.ozet || y.altBaslik)) aciklama.setAttribute('content', y.ozet || y.altBaslik);

            let html =
                '<article>' +
                '<header class="max-w-3xl mx-auto text-center">' +
                    '<a href="yazilarim.html' + (ONIZLEME ? '?onizleme' : '') + '" class="rubrik hover:text-navy transition-colors">' + kacis(y.tur || 'Yazılarım') + '</a>' + taslakIsareti(y) +
                    '<h1 class="mt-6 font-display font-medium text-navy leading-[1.03] text-[clamp(2.6rem,6.4vw,4.9rem)] text-balance">' + kacis(y.baslik) + '</h1>' +
                    (y.altBaslik ? '<p class="mt-6 mx-auto max-w-[40rem] italic text-[1.3rem] leading-[1.55] text-muted text-balance">' + kacis(y.altBaslik) + '</p>' : '') +
                    '<p class="mt-9 font-label text-[0.72rem] font-medium uppercase tracking-[0.2em] text-navy">Deniz Köroğlu</p>' +
                    '<p class="mt-2 font-label text-[0.68rem] uppercase tracking-[0.16em] text-muted">' + tarihYaz(y.tarih) + '</p>' +
                '</header>';
            if (y.gorsel) {
                html += '<figure class="mt-12 md:mt-14 max-w-4xl mx-auto">' +
                        '<img src="' + kacis(y.gorsel) + '" alt="" class="block w-full h-auto" decoding="async">' +
                        (y.gorselNotu ? '<figcaption class="mt-3 text-right italic text-[0.8125rem] leading-snug text-muted">' + kacis(y.gorselNotu) + '</figcaption>' : '') +
                        '</figure>';
            } else {
                html += '<div class="mx-auto mt-12 h-px w-16 bg-bordo"></div>';
            }
            html += '<div class="yazi max-w-[38rem] mx-auto mt-12 md:mt-14">' + metniCevir(y.metin) + '</div>';

            html += '<footer class="max-w-[38rem] mx-auto mt-14">';
            if (y.ilkYayin) html += '<p class="italic text-[0.9375rem] leading-relaxed text-muted">' + satirIci(kacis(y.ilkYayin)) + '</p>';
            if (Array.isArray(y.kaynaklar) && y.kaynaklar.length) {
                html += '<div class="mt-10 pt-6 border-t border-line"><p class="rubrik">Kaynaklar</p><ol class="mt-4 space-y-2 text-[0.9375rem] leading-[1.7] text-muted">' +
                        y.kaynaklar.map(k => '<li>' + satirIci(kacis(k)) + '</li>').join('') + '</ol></div>';
            }
            html += '<div class="mt-12 pt-8 border-t border-line">' +
                    '<p class="text-[1rem] leading-[1.75] text-ink"><span class="font-display text-[1.3rem] font-semibold text-navy">Deniz Köroğlu</span>, Ankara\'da psikanalitik yaklaşımla çalışan klinik psikolog ve psikoterapisttir.</p>' +
                    '</div></footer></article>';

            const digerleri = yazilar.filter(x => x.adres !== y.adres).slice(0, 3);
            if (digerleri.length) {
                html += '<section class="mt-24 md:mt-28">' +
                        '<div class="ust-cizgi"></div>' +
                        '<p class="rubrik text-center mt-8">Diğer yazılar</p>' +
                        '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-10 lg:gap-x-12 gap-y-14 mt-10">' +
                        digerleri.map(x => kart(x, 'text-[1.6rem]')).join('') + '</div></section>';
            }
            alan.innerHTML = html;
        })();
    </script>
</body>
</html>
